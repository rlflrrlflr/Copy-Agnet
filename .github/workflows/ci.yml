name: regression
on:
  push:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST 야간 회귀
jobs:
  headless-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i puppeteer@22 >/dev/null
      - name: run all _test_*.js (v30/v31/v32 전체)
        run: bash run_tests.sh
